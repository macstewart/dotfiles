### tmuxifier
bind-key k run-shell "tmux display-popup -E -B -w 90% -h 90% ~/.config/utils/tmux-sessionizer; true"
bind-key K run-shell "tmux display-popup -E -B -w 90% -h 90% ~/.config/utils/tmux-worktree-picker; true"
bind-key n run-shell "tmux display-popup -E -B -w 90% -h 90% ~/.config/utils/tmux-sessionizer -d ~/proj"
# bind-key f run-shell "result=$(~/.config/utils/tmux-filepicker); [ -n \"$result\" ] && tmux send-keys \"$result\""
### claude-flow conductor
bind-key f switch-client -T FLOW
bind-key -T FLOW f if-shell "tmux list-windows -t flow -F '##W' 2>/dev/null | grep -qx conductor" "switch-client -t flow:conductor" "display-message 'no flow:conductor window'"
# Zoomed pane, not a popup: tmux popups drop OSC 8 hyperlinks, so the trail's links wouldn't click.
bind-key -T FLOW l split-window -Z "~/.claude/skills/conductor/bin/flow-trail"
bind-key e display-popup -h 30 -w 100 -E "workmux dashboard"

### suck dir
bind-key / run-shell "~/.config/utils/tmux-sessionizer ~/suck"
### lazygit
bind-key g run-shell "tmux display-popup -E -w 90% -h 90% ~/.config/utils/tmux-lazygit"

### nvim in active pane's dir
bind-key v display-popup -E -w 90% -h 90% -d "#{pane_current_path}" nvim

### llm one-shot: prompt, then paste the extracted answer into the active pane
# display-popup does not format-expand its shell-command, so #{pane_id} is
# resolved by the enclosing run-shell and passed in as an argument.
bind-key i run-shell "tmux display-popup -E -B -w 70% -h 5 -d '#{pane_current_path}' '~/.config/utils/tmux-llm #{pane_id}'; true"

