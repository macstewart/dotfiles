
# unbind C-b
set-option -g prefix C-b
set-option -g prefix2 C-a
bind C-b send-prefix
bind C-a send-prefix -2

bind - run-shell 'tmux split-window -v -c "$(~/.config/utils/tmux-window-dir)"'
bind = run-shell 'tmux split-window -h -c "$(~/.config/utils/tmux-window-dir)"'

bind x killp # kill pane
bind X run-shell "~/.config/utils/tmux-kill-window" # kill window (workmux teardown for wt| windows)
bind z resize-pane -Z # toggle zoom on active pane
# status is 2 lines when @agents_bar is on (see tmux.style.conf)
bind \\ if -F '#{==:#{status},off}' { if -F '#{@agents_bar}' { set status 2 } { set status on } } { set status off }
bind | if -F '#{@agents_bar}' { set @agents_bar 0 ; if -F '#{!=:#{status},off}' { set status on } } { set @agents_bar 1 ; if -F '#{!=:#{status},off}' { set status 2 } }

bind C-l send-keys C-l \; clear-history

# move to last active session
bind tab switch-client -l
bind a last-window          # move to last active window

bind F5 source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

bind -n C-Up resize-pane -U 5
bind -n C-Down resize-pane -D 5
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5

bind C-J swap-pane -s '{down-of}'
bind C-K swap-pane -s '{up-of}'
bind C-H swap-pane -s '{left-of}'
bind C-L swap-pane -s '{right-of}'

bind-key -n 'C-M-S-Enter' 'send-keys "\e[27;8;13~"'

bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5

bind r send-keys -t '~' C-c C-p Enter # run last command in highlighted pane

