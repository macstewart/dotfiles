### spotify
bind-key s run-shell "tmux display-popup -E -w 90% -h 90% spt"
### choose session
bind-key w switch-client -T WORKMUX
bind-key -T WORKMUX w run-shell "tmux display-popup -E -w 90% -h 90% 'workmux dashboard'"
bind-key -T WORKMUX g run-shell "tmux display-popup -E -B -w 90% -h 90% ~/.config/utils/tmux-pr-picker; true"
bind-key ? run-shell "tmux neww \"source ~/.env; cgpt\""
# bind-key ? run-shell "tmux neww \"export TESTVAR='test'; echo $TESTVAR\""
bind-key R respawn-window 

bind-key S {
  setw synchronize-panes
}

#######################################
#######*COPY MODE
#######################################
bind-key C-p copy-mode
bind-key C-u copy-mode

bind-key -T copy-mode-vi v send -X begin-selection

# yy copies the current line; y copies an active selection
bind-key -T copy-mode-vi y if-shell -F '#{selection_present}' {
  send -X copy-pipe-and-cancel pbcopy
} {
  switch-client -T copy-mode-y
}
bind-key -T copy-mode-y y {
  send -X select-line
  send -X copy-pipe-and-cancel pbcopy
}
# bind -n M-m copy-mode
bind -T copy-mode-vi C-. {
  send -X next-prompt -o
}
bind -n C-. {
  copy-mode
  send -X next-prompt -o
}
bind -T copy-mode-vi C-, {
  send -X previous-prompt -o
}
bind -n C-, {
  copy-mode
  send -X previous-prompt -o
}

unbind V

bind V {
  copy-mode
  send -X previous-prompt -o
  send -X select-line
  send -X search-forward-text "\u00A0"
  send -X cursor-up
  send -X cursor-up
  send -X stop-selection
  send -X copy-pipe-and-cancel pbcopy
  display 'last result copied'
}
# bind-key -T copy-mode-vi up send-keys -X previous-prompt
# bind-key -T copy-mode-vi down send-keys -X next-prompt

