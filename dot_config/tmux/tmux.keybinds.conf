# Status line 1 clicks: an agent (range=user|p<pane id number>) jumps to its pane; a
# group header (range=user|fold_<grp>) toggles @agents_fold_<grp>; anything
# else keeps the default window-list behaviour.
bind -n MouseDown1Status if -F '#{m:p[0-9]*,#{mouse_status_range}}' { run -C 'switch-client -t "%#{s/^p//:mouse_status_range}"' } { if -F '#{m:fold_*,#{mouse_status_range}}' { run -C 'set -gF @agents_#{mouse_status_range} "##{?##{@agents_#{mouse_status_range}},0,1}"' ; run -b '~/.config/utils/tmux-agents-render' } { switch-client -t = } }

# Right-click an agent on status line 1 → dynamic per-agent menu (tmux-agent-menu);
# anything else keeps tmux's default window menu (copied from tmux 3.6 defaults).
bind -n MouseDown3Status if -F '#{m:p[0-9]*,#{mouse_status_range}}' { run -b "~/.config/utils/tmux-agent-menu show '#{mouse_status_range}' '#{client_name}' #{mouse_x} #{mouse_status_line} #{client_height}" } { display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window } }

# AGENTS mode (Cmd+a, via Ghostty sending \e[9001~ → User0): keyboard control of the agents bar. The mode stays
# active after each key; Esc/q/Enter/any unbound key leaves it.
# Logic lives in ~/.config/utils/tmux-agents-mode.
%hidden agents_mode="~/.config/utils/tmux-agents-mode"
set -s user-keys[0] "\e[9001~"
# Switch tables first and render in the background so the mode is live
# immediately (the enter script takes ~80ms).
bind -n User0 switch-client -T AGENTS \; set -g @agents_mode 1 \; run -b "$agents_mode enter"
bind -T AGENTS j run "$agents_mode move 1" \; switch-client -T AGENTS
bind -T AGENTS l run "$agents_mode move 1" \; switch-client -T AGENTS
bind -T AGENTS Right run "$agents_mode move 1" \; switch-client -T AGENTS
bind -T AGENTS Tab run "$agents_mode move 1" \; switch-client -T AGENTS
bind -T AGENTS k run "$agents_mode move -1" \; switch-client -T AGENTS
bind -T AGENTS h run "$agents_mode move -1" \; switch-client -T AGENTS
bind -T AGENTS Left run "$agents_mode move -1" \; switch-client -T AGENTS
bind -T AGENTS BTab run "$agents_mode move -1" \; switch-client -T AGENTS
bind -T AGENTS n run "$agents_mode attention" \; switch-client -T AGENTS
bind -T AGENTS Enter run -b "$agents_mode go '#{client_name}'"
bind -T AGENTS Space run -b "$agents_mode go '#{client_name}'"
bind -T AGENTS p run -b "$agents_mode act pr '#{client_name}'" \; switch-client -T AGENTS
bind -T AGENTS b run "$agents_mode act copy-branch '#{client_name}'" \; switch-client -T AGENTS
bind -T AGENTS u run "$agents_mode act toggle-unread '#{client_name}'" \; switch-client -T AGENTS
bind -T AGENTS d run "$agents_mode act forget '#{client_name}'" \; switch-client -T AGENTS
bind -T AGENTS r run "$agents_mode act rename '#{client_name}'"
bind -T AGENTS X run "$agents_mode act close '#{client_name}'"
bind -T AGENTS m run "$agents_mode act menu '#{client_name}'"
bind -T AGENTS g set -gF @agents_fold_gen '#{?@agents_fold_gen,0,1}' \; run "~/.config/utils/tmux-agents-render" \; switch-client -T AGENTS
bind -T AGENTS w set -gF @agents_fold_wt '#{?@agents_fold_wt,0,1}' \; run "~/.config/utils/tmux-agents-render" \; switch-client -T AGENTS
bind -T AGENTS c set -gF @agents_fold_cr '#{?@agents_fold_cr,0,1}' \; run "~/.config/utils/tmux-agents-render" \; switch-client -T AGENTS
bind -T AGENTS f set -gF @agents_fold_flow '#{?@agents_fold_flow,0,1}' \; run "~/.config/utils/tmux-agents-render" \; switch-client -T AGENTS
bind -T AGENTS 1 run -b "$agents_mode nth 1 '#{client_name}'"
bind -T AGENTS 2 run -b "$agents_mode nth 2 '#{client_name}'"
bind -T AGENTS 3 run -b "$agents_mode nth 3 '#{client_name}'"
bind -T AGENTS 4 run -b "$agents_mode nth 4 '#{client_name}'"
bind -T AGENTS 5 run -b "$agents_mode nth 5 '#{client_name}'"
bind -T AGENTS 6 run -b "$agents_mode nth 6 '#{client_name}'"
bind -T AGENTS 7 run -b "$agents_mode nth 7 '#{client_name}'"
bind -T AGENTS 8 run -b "$agents_mode nth 8 '#{client_name}'"
bind -T AGENTS 9 run -b "$agents_mode nth 9 '#{client_name}'"
bind -T AGENTS User0 run -b "$agents_mode exit"
bind -T AGENTS ? display-popup -E -w 44 -h 30 -T " agents keys " "$agents_mode help" \; switch-client -T AGENTS
bind -T AGENTS Escape run -b "$agents_mode exit"
bind -T AGENTS q run -b "$agents_mode exit"
bind -T AGENTS Any run -b "$agents_mode exit"
